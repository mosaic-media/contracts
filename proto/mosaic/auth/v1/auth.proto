// Package mosaic.auth.v1 is how a client obtains the session every other
// first-party call needs (platform#37).
//
// It is deliberately a service of its own rather than more RPCs on
// mosaic.session.v1.SessionService. Every request on that service begins with a
// session ref, because a session intent is by definition something a session
// does; sign-in is the one call made *without* a session, and folding it in
// would put the service's only unauthenticated methods next to the ones whose
// whole contract is that they are authenticated. Separating them also lets the
// Platform mount them behind different interceptors.
//
// This surface replaced the GraphQL signIn/signOut mutations when platform#37
// retired the GraphQL transport. Errors carry the Platform's fixed error
// categories as Connect/gRPC codes — a bad password is UNAUTHENTICATED, not a
// 200 with an error object.
syntax = "proto3";

package mosaic.auth.v1;

import "google/protobuf/timestamp.proto";
import "mosaic/sdui/v1/sdui.proto";
import "mosaic/session/v1/session.proto";

option go_package = "github.com/mosaic-media/contracts/gen/mosaic/auth/v1;authv1";

// AuthService mints and revokes sessions, and answers the one client that has
// none. Every call is unary: there is nothing to push before a client has a
// session to push to.
service AuthService {
  // Bootstrap is the first call every client makes, before it has anything
  // (platform#57). It answers with the skin, the definitions the doorway needs and
  // the doorway itself, in one response — because definitions and the token set
  // are otherwise pushed on connect, which is to say after a session exists, and
  // a client without one has no vocabulary at all rather than a thin one.
  //
  // It is unauthenticated by necessity and rate-limited by consequence: it is
  // the only surface reachable before authentication, and it does not vary on
  // any identity, so nothing about it can be used to learn who exists.
  rpc Bootstrap(BootstrapRequest) returns (BootstrapResponse);
  // Invoke runs an action the doorway emitted, before there is a session to run
  // it on. It is the pre-session counterpart of
  // mosaic.session.v1.SessionService.Invoke and exists for the same reason:
  // the surface a client can reach is the enumeration the server dispatches,
  // not something the client knows the meaning of.
  //
  // A doorway is a screen like any other, so its controls emit actions like any
  // other. What it does not have is the two-lane transport those actions
  // normally answer on — there is no session, so there is no push lane — which
  // is why the outcome rides the unary response instead: a minted session, a
  // replacement doorway, or the fields that were refused.
  //
  // A client dispatches every doorway action here without interpreting any of
  // them. That is the property worth keeping: a client that special-cased
  // "signIn" would be a client that had to be released before the door could
  // change.
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  // SignIn authenticates a local user with a password and issues a session.
  // The returned session id is the opaque ref (platform#13) the client presents on
  // every SessionService call.
  //
  // It stays a method of its own rather than becoming a doorway action: an
  // automated client with credentials and no interest in a screen should not
  // have to render a door to use them.
  rpc SignIn(SignInRequest) returns (SignInResponse);
  // SignOut revokes a session server-side. A client revoking its own session
  // passes the same value for both fields; revoking another device's session is
  // an authorised act, which is why the caller is named separately.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  // Refresh exchanges a refresh token for a new pair (platform#58). The presented
  // token is spent by the exchange: rotation is the load-bearing part, and a
  // token presented twice revokes the whole chain rather than being refused on
  // its own.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
}

// BootstrapRequest asks for the doorway.
//
// It carries no identity, by design. The response is the same whether a
// username exists or not, so there is nothing here to vary it on.
message BootstrapRequest {
  // The same vocabulary declaration Attach carries, so platform#52's negotiation
  // applies to the doorway exactly as it applies to every screen after it. It
  // is literally the same message rather than a copy of its shape: two
  // declarations that must not diverge are one declaration.
  //
  // No ClientProfile: nothing at a doorway plays.
  mosaic.session.v1.VocabularyProfile vocabulary = 1;
}

// BootstrapResponse is everything a client needs to draw one screen, and
// nothing else.
//
// The three fields arrive together deliberately. Splitting them would make "the
// vocabulary arrives before the render" two mechanisms that can each succeed
// while the other does not — which is precisely the failure this replaces: the
// tree was right, the vocabulary was absent, and nothing anywhere reported a
// mismatch.
message BootstrapResponse {
  // The design token set (contracts#4), as the same DTCG document the session
  // pushes. Without it the doorway would be the one screen drawn unstyled.
  bytes tokens = 1;
  // The component definitions the tree needs, **transitively closed over it and
  // no larger**. This is the one payload an unauthenticated party can
  // enumerate, so it describes a doorway and nothing else; the subset is the
  // security property, not an optimisation, and it must not be allowed to grow
  // into the whole library out of convenience.
  bytes definitions = 2;
  // The doorway. Which one is the server's decision, unchanged from platform#54:
  // the setup tree while the server is unclaimed, the sign-in tree once it is
  // not. A doorway has two states and the client is not told which — it is
  // shown one.
  mosaic.sdui.v1.UINode ui_node = 3;
}

// InvokeRequest carries one doorway action and whatever the form beneath it
// collected.
//
// input is the SDUI runtime's action envelope in JSON, exactly as it is on
// mosaic.session.v1.InvokeRequest — an action's ABI is a property of the action
// rather than of the transport carrying it, so the two lanes must not describe
// the same envelope differently.
message InvokeRequest {
  // The action name the doorway's control emitted. The server enumerates what
  // it will dispatch; an action it does not know is refused rather than
  // guessed at.
  string action = 1;
  // The action's input, as a JSON object.
  bytes input = 2;
  // The device the resulting session would belong to. Carried on the request
  // rather than inside input because a session belongs to a device whatever the
  // action was, and an action that mints one must not have to remember to say
  // so.
  string device_id = 3;
  // The same vocabulary declaration Bootstrap carries, so a replacement doorway
  // is negotiated exactly as the first one was (platform#52). Without it the
  // second tree a client is sent would be the one tree nobody degraded.
  mosaic.session.v1.VocabularyProfile vocabulary = 4;
}

// InvokeResponse is one of three outcomes, and the oneof is what makes them
// exclusive rather than a set of fields a client has to rank.
//
// A transport-level failure is still a Connect error — an unknown action is
// INVALID_ARGUMENT, a rate limit is RESOURCE_EXHAUSTED. What is here is the set
// of things that are *answers*: the action worked and minted a session, the
// action worked and the door now shows something else, or the submission was
// refused in a way that belongs on the fields it came from.
message InvokeResponse {
  oneof outcome {
    // The action signed the caller in. From here the client is on the session
    // transport and this service is done with it.
    Signed signed = 1;
    // The door now shows something else — the next step of a wizard, or a
    // sign-in form where a setup form was. The definitions travel with it for
    // the same reason they travel with Bootstrap: a client at this point still
    // has no vocabulary but the subset it was last sent, and a tree naming a
    // component outside that subset would draw the placeholder platform#57 exists
    // to remove.
    Doorway doorway = 2;
    // The submission was refused, per field (contracts#13). It is the same envelope
    // the session lane pushes, so a rejection renders identically whichever
    // lane it arrived on.
    mosaic.session.v1.FieldErrors field_errors = 3;
  }
}

// Signed is a minted session and the pair that spends it.
message Signed {
  Session session = 1;
  TokenPair tokens = 2;
}

// Doorway is a replacement pre-session tree and the definitions it needs.
//
// The token set is deliberately absent: the skin arrived with Bootstrap and
// does not change between two states of the same door, so re-sending it on
// every step of a wizard would be the largest field in the response and the one
// least likely to differ.
message Doorway {
  bytes definitions = 1;
  mosaic.sdui.v1.UINode ui_node = 2;
}

// SignInRequest is a local username/password authentication from a named
// device. device_id is required: a session belongs to a device, so the Platform
// can revoke one client without ending the others.
message SignInRequest {
  string username = 1;
  string password = 2;
  string device_id = 3;
}

// SignInResponse carries the issued session and the credential pair that spends
// it.
message SignInResponse {
  Session session = 1;
  // The bearer pair (platform#58). A client stores both and presents the access
  // token on every SessionService call.
  TokenPair tokens = 2;
}

// TokenPair is the session credential (platform#58): a short-lived access token
// presented on every call, and a long-lived refresh token exchanged for a new
// pair.
//
// Both are **opaque** — not JWTs, and not for fashion. A claims-carrying token
// makes a tightened limit or a revoked grant take effect only when the token
// expires; validation here is a store read, and that cost is accepted
// deliberately. Neither rides a cookie: three of the four clients this
// transport was chosen against have no use for one, and the credential must not
// depend on a same-origin front door that does not exist.
//
// A client stores both in whatever secure storage its platform has —
// localStorage on the web, the keychain or keystore on native. On the web that
// is reachable by any script that gets into the page, which is stated plainly
// rather than smoothed over: what limits the damage is the short access
// lifetime, rotation with reuse detection, and per-device revocation.
message TokenPair {
  string access_token = 1;
  google.protobuf.Timestamp access_expires_at = 2;
  // The refresh token, bound to the device the session was issued to and
  // **rotated on every use**. The value returned here is spent the moment it is
  // exchanged; a client that keeps the old one and presents it again revokes
  // the whole chain, which is what makes theft detectable rather than silent.
  string refresh_token = 3;
  google.protobuf.Timestamp refresh_expires_at = 4;
}

// RefreshRequest exchanges a refresh token for a new pair.
//
// The device is named as well as the token because the token is bound to it:
// a refresh presented from a different device is a stolen credential being
// used, not a client that moved.
message RefreshRequest {
  string refresh_token = 1;
  string device_id = 2;
}

// RefreshResponse carries the new pair and the session it belongs to.
message RefreshResponse {
  Session session = 1;
  TokenPair tokens = 2;
}

// SignOutRequest revokes target_session on behalf of caller_session.
//
// caller_session is the caller's credential — its access token (platform#58), the
// same value it presents on every SessionService call. target_session is the
// **session id** of the device being ended, which is what a device list names
// and is not itself a credential.
//
// Signing out now means revoking the refresh chain, not merely dropping a value
// the client was holding.
message SignOutRequest {
  string caller_session = 1;
  string target_session = 2;
}

// SignOutResponse echoes the session that was revoked.
message SignOutResponse {
  string session = 1;
}

// Session is the projection of an issued session a client is allowed to see.
message Session {
  string id = 1;
  string user_id = 2;
  string device_id = 3;
  google.protobuf.Timestamp issued_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  // The **absolute** expiry (platform#58): the moment past which no refresh can
  // extend this session, however recently it was used. It is not the access
  // token's lifetime, which is minutes and is carried on TokenPair, and it is
  // not the idle ceiling, which the server applies against last_seen_at and
  // does not publish — a client that knew it would be tempted to poll to stay
  // inside it.
  google.protobuf.Timestamp expires_at = 6;
  string auth_strength = 7;
  // What this session may do — the caller's flattened authority, resolved once
  // when the session was issued.
  //
  // It was absent until a session genuinely carried one. `domain.Session` had
  // modelled the field and the Postgres store had round-tripped it since the
  // beginning, and nothing ever populated it, so the GraphQL surface this
  // replaced answered every sign-in with an empty list — which a client would
  // reasonably have read as "hide everything". A field that is always empty is
  // worse than an absent one, so it was left out until it was true.
  //
  // **It is not a permission check and a client must not use it as one.** Every
  // call re-authorises server-side against the grants as they are *now*, and
  // this list is a snapshot as they were at issue time; a grant revoked since
  // is still in here and is refused anyway. What it is for is
  // [platform#24](0036): an affordance the caller could not exercise should not be
  // drawn, and until now that was a decision only the server could make,
  // because only the server knew. A client that composes its own chrome — a
  // native one deciding whether to draw an admin tab before it asks for a
  // screen — can now make the same omission the emit-side makes.
  repeated string capabilities = 8;
}
